name: NcnsDSH
options:
  bundleIdPrefix: com.nevercrynow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  NcnsDSH:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Engine/runtime.zip
        optional: true
        buildPhase: resources
    # 内置引擎（dsh-Go iOS 分支，AGPL-3.0，见 NOTICE）。CI 在 xcodegen 之前把产物放进
    # Engine/；这里用 dependencies 才会进 Embed Frameworks（sources 的 embed 不生效）。
    # 没有 Engine/ 时 xcodegen 会失败——先跑 tools/stage-engine.sh。
    dependencies:
      - framework: Engine/Frameworks/DshNodeHost.framework
        embed: true
        codeSign: false
      - framework: Engine/Frameworks/DshFlock.framework
        embed: true
        codeSign: false
      - framework: Engine/Frameworks/DshRequireBuiltin.framework
        embed: true
        codeSign: false
      - framework: Engine/NodeMobile.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nevercrynow.ncnsdsh
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: NcnsDSH
        MARKETING_VERSION: "2.23.3"
        CURRENT_PROJECT_VERSION: "41"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
