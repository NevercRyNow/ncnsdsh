name: NcnsDSH
options:
  bundleIdPrefix: com.nevercrynow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  NcnsDSH:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
        excludes:
          - "Info.plist"
      # 内置引擎（dsh-Go iOS 分支，AGPL-3.0，见 NOTICE）：CI 在 xcodegen 之前把这些产物
      # 放进 Engine/。optional 保证没有引擎的本地构建也能生成工程，只是 App 里报「未嵌入」。
      - path: Engine/Frameworks/DshNodeHost.framework
        optional: true
        embed: true
        buildPhase: none
      - path: Engine/Frameworks/DshFlock.framework
        optional: true
        embed: true
        buildPhase: none
      - path: Engine/Frameworks/DshRequireBuiltin.framework
        optional: true
        embed: true
        buildPhase: none
      - path: Engine/runtime.zip
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nevercrynow.ncnsdsh
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: NcnsDSH
        MARKETING_VERSION: "2.23.0"
        CURRENT_PROJECT_VERSION: "38"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
