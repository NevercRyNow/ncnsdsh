name: Build NcnsDSH IPA

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟一次会和 push 抢同一个 concurrency 组，macOS runner 又排得很慢；
    # 改成每天一次兜底，正常出包靠 push。
    - cron: "0 3 * * *"
  push:
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ncnsdsh-ipa
  # 定时任务已经改成每天一次，不会再有排队堆积；这里保持 false——之前设成 true 时
  # 观察到排队中的 job 会被清掉，分不清是并发策略还是 runner 容量，先排除前者。
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NcnsDSH.xcodeproj \
            -scheme NcnsDSH \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NcnsDSH.app Payload/
          zip -qry NcnsDSH-unsigned.ipa Payload
          shasum -a 256 NcnsDSH-unsigned.ipa | tee SHA256.txt
          ls -lh NcnsDSH-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NcnsDSH-unsigned-ipa
          path: |
            NcnsDSH-unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 14


      - name: Attach the IPA to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: false
          files: NcnsDSH-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NcnsDSH-build-log
          path: build.log
          if-no-files-found: ignore
