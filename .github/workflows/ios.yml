name: Build NcnsDSH IPA

on:
  workflow_dispatch:
  schedule:
    # 原先每 30 分钟一次，会和 push 一起把排队堆起来；改成每天一次兜底，
    # 正常出包靠 push 和手动 dispatch。
    - cron: "0 3 * * *"
  push:
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

# 并发组整个去掉：定时任务已经每天一次，不存在堆积；而排队中的 job 反复被清，
# 需要先排除 concurrency 这个变量，再判断是不是 runner 容量。

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NcnsDSH.xcodeproj \
            -scheme NcnsDSH \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NcnsDSH.app Payload/
          zip -qry NcnsDSH-unsigned.ipa Payload
          shasum -a 256 NcnsDSH-unsigned.ipa | tee SHA256.txt
          ls -lh NcnsDSH-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NcnsDSH-unsigned-ipa
          path: |
            NcnsDSH-unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 14


      - name: Attach the IPA to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: false
          files: NcnsDSH-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NcnsDSH-build-log
          path: build.log
          if-no-files-found: ignore
